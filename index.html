
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="تطبيق بسيط واحترافي لتنظيم المهام اليومية" />
  <title>أنجز | قائمة المهام</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-container">
    <header class="topbar">
      <a class="brand" href="#" aria-label="أنجز - الصفحة الرئيسية"><span>✓</span>أنجز</a>
      <button id="theme-button" class="icon-button" aria-label="تفعيل الوضع الليلي" title="تبديل المظهر">☾</button>
    </header>

    <section class="todo-card" aria-labelledby="main-title">
      <div class="hero">
        <h1 id="main-title">رتّب يومك يا <input id="name-input" type="text" maxlength="25" autocomplete="name" placeholder="اكتب اسمك" aria-label="اسمك" /> ✨</h1>
        <p id="today-date"></p>
        <div class="progress-row">
          <div class="progress-track" aria-label="نسبة إنجاز المهام"><span id="progress-bar"></span></div>
          <span id="progress-label">0 من 0 مكتملة</span>
        </div>
      </div>

      <div class="content">
        <form id="task-form" class="add-task-form">
          <label class="sr-only" for="task-input">مهمة جديدة</label>
          <input id="task-input" type="text" maxlength="120" autocomplete="off" placeholder="ما الذي تريد إنجازه؟" required />
          <button class="add-button" type="submit" aria-label="إضافة المهمة">+</button>
        </form>

        <div class="toolbar">
          <div class="filters" aria-label="فلترة المهام">
            <button class="filter active" type="button" data-filter="all">الكل</button>
            <button class="filter" type="button" data-filter="active">قيد التنفيذ</button>
            <button class="filter" type="button" data-filter="completed">مكتملة</button>
          </div>
          <div class="search-box">
            <span aria-hidden="true">⌕</span>
            <label class="sr-only" for="search-input">البحث في المهام</label>
            <input id="search-input" type="search" placeholder="ابحث عن مهمة" />
          </div>
        </div>

        <ul id="task-list" class="task-list" aria-live="polite"></ul>
        <footer class="task-footer">
          <span id="remaining-count">لا توجد مهام</span>
          <button id="clear-completed" class="clear-button" type="button">حذف المكتملة</button>
        </footer>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
